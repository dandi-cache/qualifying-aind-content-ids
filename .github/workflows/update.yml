name: Update

on:
  schedule:
    - cron: "0 6/4 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "The number of sessions (content IDs) to process in this run."
        required: false
        type: number
        default: 2000

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets._GITHUB_API_KEY }}

jobs:
  Update:
    runs-on: ubuntu-latest

    steps:
      - name: Check for running workflows
        env:
          GH_TOKEN: ${{ secrets._GITHUB_API_KEY }}
        run: |
          RUNNING_COUNT=$(gh run list --repo "${{ github.repository }}" --workflow "${{ github.workflow }}" --status in_progress --json databaseId | jq '. | length')

          if [ "$RUNNING_COUNT" -gt 1 ]; then
            echo "Another run is already in progress. Cancelling this run..."
            gh run cancel --repo "${{ github.repository }}" ${{ github.run_id }}
            # Sleep to allow cancellation to propagate
            sleep 60
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets._GITHUB_API_KEY }}
          submodules: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Cache submodule
        uses: actions/cache@v4
        with:
          path: |
            sourcedata/content-id-to-nwb-files
            .git/modules/sourcedata
          key: sourcedata-content-id-to-nwb-files-${{ github.run_id }}
          restore-keys: sourcedata-content-id-to-nwb-files-

      - name: Update submodule
        run: |
          for attempt in 1 2 3; do
            if git submodule update --init --remote sourcedata/content-id-to-nwb-files; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 30
          done

      - name: Run update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          uv run --project envs python code/update.py --limit "${{ github.event.inputs.limit || '2000' }}"

      - name: Upload YAML
        run: |
          git add .
          git commit --message "update" || true  # || true in case of no changes
          for attempt in 1 2 3; do
            if git push; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            git pull --rebase
          done

      - name: Run minification
        run: uv run --project envs python code/minify.py

      - name: Upload minification
        run: |
          git push origin --delete min || true  # || true in case branch doesn't exist yet

          git checkout -b min
          git add .
          git commit --message "update min" || true  # || true in case of no changes
          git push --set-upstream origin min

  NotifyOnFailure:
    runs-on: ubuntu-latest
    needs: [ Update ]
    if: ${{ always() && failure() }}
    steps:
      - uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI Failure: DANDI Cache: Qualifying AIND Content IDs"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: dandi-cache
          body: "Please check the latest run of the DANDI Cache update: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
